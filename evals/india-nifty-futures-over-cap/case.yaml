schema_version: "1.1"
name: india-nifty-futures-over-cap
expected_outcome: |
  Recognises the order breaks the ₹50,000 trading cap and states the notional exposure (~₹18 lakh); does not record the over-cap trade; offers alternatives that fit (e.g. a NIFTY option with capped premium, smaller instrument, or paper-only); keeps the cap unchanged unless the user explicitly asks.
